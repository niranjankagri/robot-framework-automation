# Continuous integration: lint first, then the whole suite in parallel, headless.
#
# Runs on every push and pull request to main, by hand (Actions tab -> Run workflow),
# and every night: the apps under test are public sites that can change without
# any commit here, so a nightly run notices that on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC every day

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip            # reuses downloaded wheels between runs (keyed on requirements.txt)

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Style and best-practice rules for .robot/.resource files (settings in pyproject.toml).
      - name: Robocop
        run: robocop check

      # Parses every suite and resolves every keyword without opening a browser or
      # calling the API: catches typos and broken imports in seconds.
      - name: Robot dry run
        run: robot --dryrun --output NONE --log NONE --report NONE tests

  tests:
    name: Tests (${{ matrix.browser }})
    needs: lint                 # no point starting browsers if the code does not even parse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false          # one browser failing should not cancel the other
      matrix:
        # Both browsers are preinstalled on ubuntu-latest; Selenium Manager gets the drivers.
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # setup-python puts its Python on PATH, so "robot" is found by pabot's workers
      # without a virtual environment.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with pabot
        env:
          BROWSER: ${{ matrix.browser }}
        run: >
          pabot --processes 4 --testlevelsplit
          --artifacts png --artifactsinsubfolders
          --outputdir results -A args/common.args -A args/ci.args
          tests

      # Pass/fail table per suite and the failed tests on the run's summary page.
      # Runs after failures too; skipped only if pabot crashed before writing output.xml.
      - name: Write job summary
        if: always() && hashFiles('results/output.xml') != ''
        run: python ci/summary.py results/output.xml "${{ matrix.browser }}"

      # Upload even when tests failed: that is exactly when the log is needed.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.browser }}
          path: |
            results/log.html
            results/report.html
            results/output.xml
            results/xunit.xml
            results/**/*.png
          retention-days: 14
